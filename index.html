<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <link rel="manifest" href="/manifest.json">
  <title>Pulse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --surface:   #111114;
      --border:    #1f1f23;
      --text:      #f0f0f0;
      --muted:     #888;
      --accent:    #fff;
      --radius:    18px;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    /* Topic palette */
    .tag-tech      { --tc:#60a5fa; --tb:rgba(96,165,250,.12); }
    .tag-startups  { --tc:#a78bfa; --tb:rgba(167,139,250,.12); }
    .tag-science   { --tc:#34d399; --tb:rgba(52,211,153,.12); }
    .tag-design    { --tc:#fbbf24; --tb:rgba(251,191,36,.12); }
    .tag-finance   { --tc:#22d3ee; --tb:rgba(34,211,238,.12); }
    .tag-culture   { --tc:#fb7185; --tb:rgba(251,113,133,.12); }
    .tag-sports    { --tc:#a3e635; --tb:rgba(163,230,53,.12); }

    html { background: var(--bg); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────── */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(var(--safe-top) + 14px) 20px 0;
      background: rgba(8,8,8,.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }

    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    #logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #refresh-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, transform .4s;
      flex-shrink: 0;
    }
    #refresh-btn:active { transform: rotate(180deg); }
    #refresh-btn.spinning svg { animation: spin .7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ──────────────────────────────────── */
    #tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      flex: 1;
      padding: 8px 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      position: relative;
      transition: color .2s;
      border-bottom: 2px solid transparent;
      letter-spacing: .01em;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }
    .tab .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      margin-left: 5px;
      vertical-align: middle;
      transition: background .2s, color .2s;
    }
    .tab.active .badge { background: var(--text); color: var(--bg); }

    /* ── Feed ──────────────────────────────────── */
    .feed-page {
      padding: 16px 16px calc(24px + var(--safe-bot));
      max-width: 680px;
      margin: 0 auto;
    }

    .feed-page.hidden { display: none; }

    /* ── Skeleton ──────────────────────────────── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
    }
    .skel {
      background: linear-gradient(90deg, #1f1f23 25%, #2a2a2e 50%, #1f1f23 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-img  { width: 100%; height: 200px; border-radius: 0; margin-bottom: 0; display: block; }
    .skel-body { padding: 14px 16px 13px; }
    .skel-tag  { width: 64px; height: 22px; margin-bottom: 14px; border-radius: 20px; }
    .skel-h1   { width: 90%; height: 18px; margin-bottom: 8px; }
    .skel-h2   { width: 70%; height: 18px; margin-bottom: 16px; }
    .skel-p1   { width: 100%; height: 13px; margin-bottom: 6px; }
    .skel-p2   { width: 85%;  height: 13px; margin-bottom: 6px; }
    .skel-p3   { width: 55%;  height: 13px; }

    /* ── Card ──────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity .35s ease,
        transform .35s ease,
        border-color .2s,
        background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card:active { border-color: #2a2a30; }
    .card:active .card-body { background: #16161a; }

    /* thumbnail */
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #1a1a1e;
    }
    .card-thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .card-thumbnail.loaded { opacity: 1; }

    /* ▶ play overlay for video cards */
    .play-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,.72);
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .play-overlay svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }

    /* content wrapper */
    .card-body {
      padding: 14px 16px 13px;
      transition: background .2s;
    }

    /* top row */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .topic-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--tb);
      color: var(--tc);
      border: 1px solid color-mix(in srgb, var(--tc) 20%, transparent);
    }

    .save-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, background .2s, border-color .2s, transform .15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .save-btn:active { transform: scale(.88); }
    .save-btn.saved {
      color: #fbbf24;
      background: rgba(251,191,36,.1);
      border-color: rgba(251,191,36,.3);
    }
    .save-btn svg { width: 15px; height: 15px; }

    /* headline */
    .card-headline {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 9px;
      letter-spacing: -.01em;
    }

    /* summary */
    .card-summary {
      font-size: 13.5px;
      line-height: 1.6;
      color: #aaa;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* bottom */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-meta {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-meta .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }

    .read-link {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: color .2s;
      padding: 4px 0 4px 8px;
    }
    .read-link:hover { color: var(--text); }
    .read-link svg { width: 12px; height: 12px; }

    /* ── Empty saved ───────────────────────────── */
    #empty-saved {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    #empty-saved svg { opacity: .25; }
    #empty-saved p { font-size: 14px; line-height: 1.5; }

    /* ── Error ─────────────────────────────────── */
    #error-banner {
      display: none;
      margin: 16px 16px 0;
      padding: 14px 16px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 12px;
      font-size: 13px;
      color: #f87171;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #error-banner.hidden { display: none; }
    #error-banner button {
      margin-left: auto;
      background: rgba(239,68,68,.2);
      border: none;
      border-radius: 8px;
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── End of feed ───────────────────────────── */
    #end-of-feed {
      text-align: center;
      padding: 28px 16px 8px;
    }
    #end-of-feed.hidden { display: none; }
    #caught-up {
      font-size: 13px;
      color: #444;
      font-weight: 500;
      letter-spacing: .02em;
      margin-bottom: 14px;
    }
    #more-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #more-btn:active { background: #1a1a1e; }
    #more-btn:disabled { opacity: .4; cursor: default; }
    #more-btn .spin { animation: spin .7s linear infinite; display: none; }
    #more-btn.loading .spin { display: inline-block; }
    #more-btn.loading .label { display: none; }

    /* topic divider between batches */
    .more-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
      color: #333;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .more-divider::before, .more-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Carta do Momento ──────────────────────── */
    #carta {
      margin-bottom: 20px;
      padding: 14px 16px;
      border-left: 3px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.025);
      border-radius: 0 12px 12px 0;
    }
    #carta.hidden { display: none; }
    #carta-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
    }
    #carta-text {
      font-size: 13.5px;
      line-height: 1.7;
      color: #bbb;
      font-style: italic;
    }
    #carta-read-more {
      display: inline;
      color: #666;
      font-style: normal;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid #444;
    }
    #carta-read-more:hover { color: #999; }

    /* ── Save tag pill + note ──────────────────── */
    .save-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 3px 9px;
      margin-top: 8px;
    }
    .card-note {
      font-size: 12.5px;
      color: #666;
      font-style: italic;
      margin-top: 6px;
      line-height: 1.45;
    }

    /* ── Intent note step ──────────────────────── */
    #intent-note-step { display: flex; flex-direction: column; gap: 10px; }
    #intent-note-step.hidden { display: none; }
    #note-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 12px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 76px;
    }
    #note-input:focus { border-color: #3a3a3e; }
    #note-input::placeholder { color: #444; }
    .note-actions {
      display: flex;
      gap: 8px;
    }
    #note-skip-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: #1f1f23;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
    }
    #note-save-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--text);
      color: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    #note-skip-btn:active { background: #2a2a2e; }
    #note-save-btn:active { background: #ccc; }

    /* ── Intent bottom sheet ───────────────────── */
    #intent-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #intent-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    #intent-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #intent-overlay.open #intent-sheet {
      transform: translateY(0);
    }
    #intent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    #intent-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .01em;
    }
    #intent-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #intent-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .intent-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #222;
      background: #111114;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
      width: 100%;
    }
    .intent-opt:active { background: #1f1f23; border-color: #333; }
    .intent-opt .emoji { font-size: 18px; line-height: 1; }

    /* ── Floating capture button ───────────────── */
    #capture-fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      z-index: 150;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.6);
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #capture-fab:active { transform: scale(.92); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    #capture-fab svg { width: 20px; height: 20px; }

    /* ── Capture bottom sheet ──────────────────── */
    #capture-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #capture-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    #capture-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #capture-overlay.open #capture-sheet { transform: translateY(0); }
    #capture-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    #capture-sheet-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    #capture-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #capture-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      padding: 11px 13px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 90px;
      margin-bottom: 10px;
    }
    #capture-input:focus { border-color: #3a3a3e; }
    #capture-input::placeholder { color: #444; }
    #capture-save-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--text);
      color: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    #capture-save-btn:active { background: #ccc; }
    #capture-save-btn:disabled { opacity: .35; cursor: default; }

    /* ── Note card (in Notes tab) ──────────────── */
    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .3s ease, transform .3s ease, border-color .2s, background .2s;
      user-select: none;
      -webkit-user-select: none;
    }
    .note-card.visible { opacity: 1; transform: translateY(0); }
    .note-card.deleting {
      opacity: 0;
      transform: scale(.95);
      transition: opacity .2s ease, transform .2s ease;
    }
    .note-card-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 8px;
      white-space: pre-wrap;
    }
    .note-card-time {
      font-size: 11.5px;
      color: #555;
      font-weight: 500;
    }
    #empty-notes {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    #empty-notes svg { opacity: .25; }
    #empty-notes p { font-size: 14px; line-height: 1.5; }

    /* ── Settings button ───────────────────────── */
    #settings-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s;
      flex-shrink: 0;
    }
    #settings-btn svg { width: 15px; height: 15px; }
    #header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Settings bottom sheet ─────────────────── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }
    #settings-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(28px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #settings-overlay.open #settings-sheet { transform: translateY(0); }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    #settings-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
    }
    .style-options { display: flex; flex-direction: column; gap: 6px; }
    .style-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid #222;
      background: #111114;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text);
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
      width: 100%;
    }
    .style-opt:active { background: #1f1f23; }
    .style-opt.selected {
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.06);
    }
    .style-opt .style-radio {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid #444;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .style-opt.selected .style-radio {
      border-color: var(--text);
      background: var(--text);
    }
    .style-opt.selected .style-radio::after {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--bg);
    }
    .style-opt-label { flex: 1; font-weight: 500; }
    .style-opt-desc { font-size: 11.5px; color: #555; margin-top: 1px; }
    #interest-brief-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.55;
      padding: 10px 12px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 72px;
    }
    #interest-brief-input:focus { border-color: #3a3a3e; }
    #interest-brief-input::placeholder { color: #444; }

    /* ── Connections block (Notes tab) ─────────── */
    #connections-block {
      margin-bottom: 20px;
      padding: 14px 16px;
      border-left: 3px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.02);
      border-radius: 0 12px 12px 0;
    }
    #connections-block.hidden { display: none; }
    #connections-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
    }
    .connection-item {
      font-size: 13px;
      line-height: 1.65;
      color: #999;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1d;
    }
    .connection-item:last-child { border-bottom: none; padding-bottom: 0; }
    #connections-loading {
      font-size: 12px;
      color: #444;
      font-style: italic;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>

<script>
// ─────────────────────────────────────────────
// IndexedDB
// ─────────────────────────────────────────────
const DB_NAME = 'pulse-db', DB_VER = 3, STORE = 'saved', NOTES_STORE = 'notes';
const SIGNALS_STORE = 'signals', SETTINGS_STORE = 'settings';
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(NOTES_STORE))
        d.createObjectStore(NOTES_STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(SIGNALS_STORE))
        d.createObjectStore(SIGNALS_STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(SETTINGS_STORE))
        d.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPut(card) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(card);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbGetAllNotes() {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readonly');
    const r = tx.objectStore(NOTES_STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPutNote(note) {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readwrite');
    tx.objectStore(NOTES_STORE).put(note);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbDeleteNote(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readwrite');
    tx.objectStore(NOTES_STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbPutSignal(signal) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SIGNALS_STORE, 'readwrite');
    tx.objectStore(SIGNALS_STORE).put(signal);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbGetAllSignals() {
  return new Promise((res, rej) => {
    const tx = db.transaction(SIGNALS_STORE, 'readonly');
    const r = tx.objectStore(SIGNALS_STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbGetSetting(key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SETTINGS_STORE, 'readonly');
    const r = tx.objectStore(SETTINGS_STORE).get(key);
    r.onsuccess = e => res(e.target.result?.value ?? null);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPutSetting(key, value) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SETTINGS_STORE, 'readwrite');
    tx.objectStore(SETTINGS_STORE).put({ key, value });
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let feedCards = [];
let savedIds = new Set();
let savedCardsMap = new Map(); // id → full card object (includes saveTag)
let activeTab = 'feed';
let notesArr = []; // [{id, text, ts}] sorted newest-first
let signals = []; // [{id, type:'save'|'read', topic, intent?, ts}]
let readingStyle = 'direct'; // persisted in settings
let interestBrief = ''; // persisted in settings as interest_brief
let currentConnections = null; // cached connections result

// ─────────────────────────────────────────────
// Utils
// ─────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// Returns top-2 preferred topics based on save (weight 2) + read (weight 1) signals
function computePreferredTopics() {
  const scores = {};
  signals.forEach(s => {
    if (!s.topic) return;
    scores[s.topic] = (scores[s.topic] || 0) + (s.type === 'save' ? 2 : 1);
  });
  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 2)
    .map(([t]) => t);
}

function logSignal(type, topic, intent = null) {
  const sig = { id: `sig-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, type, topic, intent, ts: Date.now() };
  signals.push(sig);
  dbPutSignal(sig).catch(() => {});
}

const BOOKMARK_EMPTY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const BOOKMARK_FILLED = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const ARROW_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>`;

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function buildCard(card) {
  const saved = savedIds.has(card.id);
  const slug = (card.topic || '').toLowerCase().replace(/\s+/g, '-');

  const el = document.createElement('article');
  el.className = `card tag-${slug}`;
  el.dataset.id = card.id;

  const playIcon = card.type === 'video'
    ? `<div class="play-overlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`
    : '';
  const thumbHTML = card.thumbnail
    ? `<div class="card-thumb-wrap">
         <img class="card-thumbnail" src="${card.thumbnail}" alt="" loading="lazy" decoding="async">
         ${playIcon}
       </div>`
    : '';

  const savedCard = savedCardsMap.get(card.id) || null;
  const tagHTML = savedCard?.saveTag
    ? `<span class="save-tag">${savedCard.saveTag}</span>`
    : '';
  const noteHTML = savedCard?.note
    ? `<p class="card-note">${savedCard.note}</p>`
    : '';

  el.innerHTML = `
    ${thumbHTML}
    <div class="card-body">
      <div class="card-top">
        <span class="topic-tag">${card.topic}</span>
        <button class="save-btn ${saved ? 'saved' : ''}" data-id="${card.id}" aria-label="${saved ? 'Unsave' : 'Save'}">
          ${saved ? BOOKMARK_FILLED : BOOKMARK_EMPTY}
        </button>
      </div>
      <h2 class="card-headline">${card.headline}</h2>
      <p class="card-summary">${card.summary}</p>
      <div class="card-bottom">
        <div class="card-meta">
          <span>${card.source}</span>
          ${card.pubDate ? `<span class="dot"></span><span>${timeAgo(card.pubDate)}</span>` : ''}
        </div>
        <a class="read-link" href="${card.link}" target="_blank" rel="noopener" aria-label="Read article">Read ${ARROW_SVG}</a>
      </div>
      ${tagHTML}
      ${noteHTML}
    </div>
  `;

  // Fade image in once loaded; hide whole wrapper on error
  if (card.thumbnail) {
    const img = el.querySelector('.card-thumbnail');
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => {
      const wrap = el.querySelector('.card-thumb-wrap');
      if (wrap) wrap.style.display = 'none';
    });
  }

  // save button — if already saved, unsave directly; otherwise open intent sheet
  el.querySelector('.save-btn').addEventListener('click', async e => {
    e.stopPropagation();
    if (savedIds.has(card.id)) {
      await unsaveCard(card.id);
      const btn = el.querySelector('.save-btn');
      btn.innerHTML = BOOKMARK_EMPTY;
      btn.classList.remove('saved');
      btn.setAttribute('aria-label', 'Save');
      updateBadges();
      if (activeTab === 'saved') renderSavedPage();
      else if (activeTab === 'read-later') renderReadLaterPage();
    } else {
      openIntentSheet(card, el);
    }
  });

  // card tap → log read signal + open link
  el.addEventListener('click', () => {
    logSignal('read', card.topic);
    window.open(card.link, '_blank', 'noopener');
  });

  // prevent read-link double-open
  el.querySelector('.read-link').addEventListener('click', e => e.stopPropagation());

  return el;
}

function skeletonHTML() {
  return Array.from({ length: 5 }, (_, i) => `
    <div class="skeleton-card">
      ${i % 2 === 0 ? '<div class="skel skel-img"></div>' : ''}
      <div class="skel-body">
        <div class="skel skel-tag"></div>
        <div class="skel skel-h1"></div>
        <div class="skel skel-h2"></div>
        <div class="skel skel-p1"></div>
        <div class="skel skel-p2"></div>
        <div class="skel skel-p3"></div>
      </div>
    </div>
  `).join('');
}

// Intersection observer for entrance animations
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.05 });

function renderFeedPage(cards, dailyBrief) {
  const page = document.getElementById('feed-page');
  // Preserve #carta element across innerHTML wipes
  const cartaEl = document.getElementById('carta') || (() => {
    const d = document.createElement('div'); d.id = 'carta'; d.className = 'hidden';
    d.innerHTML = '<div id="carta-label">Carta do Momento</div><p id="carta-text"></p>';
    return d;
  })();
  page.innerHTML = '';
  page.appendChild(cartaEl);

  if (dailyBrief) {
    const cartaText = document.getElementById('carta-text');
    const TRUNCATE = 180;
    if (dailyBrief.length > TRUNCATE) {
      const preview = dailyBrief.slice(0, TRUNCATE).trimEnd();
      const rest = dailyBrief.slice(TRUNCATE);
      const restSpan = document.createElement('span');
      restSpan.textContent = rest;
      restSpan.style.display = 'none';
      const ellipsis = document.createTextNode('… ');
      const readMore = document.createElement('span');
      readMore.id = 'carta-read-more';
      readMore.textContent = 'Read more';
      readMore.addEventListener('click', () => {
        restSpan.style.display = 'inline';
        ellipsis.textContent = '';
        readMore.remove();
      });
      cartaText.textContent = '';
      cartaText.appendChild(document.createTextNode(preview));
      cartaText.appendChild(restSpan);
      cartaText.appendChild(ellipsis);
      cartaText.appendChild(readMore);
    } else {
      cartaText.textContent = dailyBrief;
    }
    cartaEl.classList.remove('hidden');
  } else {
    cartaEl.classList.add('hidden');
  }

  cards.forEach((c, i) => {
    const el = buildCard(c);
    // stagger delay capped at 300ms
    el.style.transitionDelay = `${Math.min(i * 40, 300)}ms`;
    page.appendChild(el);
    io.observe(el);
  });
  document.getElementById('feed-count').textContent = cards.length || '—';
  document.getElementById('end-of-feed').classList.remove('hidden');
}

const READ_LATER_TAG = '📌 Read later';

function renderSavedPage() {
  const page = document.getElementById('saved-page');
  page.innerHTML = '';
  const cards = [...savedCardsMap.values()].filter(c => c.saveTag !== READ_LATER_TAG);
  if (cards.length === 0) {
    page.innerHTML = emptyHTML('Nothing saved yet.<br>Tap the bookmark on any card.');
    return;
  }
  cards.forEach((c, i) => {
    const el = buildCard(c);
    el.style.transitionDelay = `${Math.min(i * 40, 200)}ms`;
    page.appendChild(el);
    io.observe(el);
  });
}

function renderReadLaterPage() {
  const page = document.getElementById('read-later-page');
  page.innerHTML = '';
  const cards = [...savedCardsMap.values()].filter(c => c.saveTag === READ_LATER_TAG);
  if (cards.length === 0) {
    page.innerHTML = emptyHTML('Nothing queued.<br>Save articles with 📌 Read later.');
    return;
  }
  cards.forEach((c, i) => {
    const el = buildCard(c);
    el.style.transitionDelay = `${Math.min(i * 40, 200)}ms`;
    page.appendChild(el);
    io.observe(el);
  });
}

function emptyHTML(msg) {
  return `<div id="empty-saved">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    <p>${msg}</p>
  </div>`;
}

function formatNoteTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function buildNoteCard(note) {
  const el = document.createElement('div');
  el.className = 'note-card';
  el.dataset.id = note.id;
  el.innerHTML = `
    <div class="note-card-text">${note.text.replace(/</g, '&lt;')}</div>
    <div class="note-card-time">${formatNoteTime(note.ts)}</div>
  `;

  // Long-press to delete
  let pressTimer = null;
  const startPress = () => {
    pressTimer = setTimeout(async () => {
      el.classList.add('deleting');
      await dbDeleteNote(note.id);
      notesArr = notesArr.filter(n => n.id !== note.id);
      updateBadges();
      setTimeout(() => el.remove(), 220);
    }, 600);
  };
  const cancelPress = () => clearTimeout(pressTimer);
  el.addEventListener('pointerdown', startPress);
  el.addEventListener('pointerup', cancelPress);
  el.addEventListener('pointerleave', cancelPress);
  el.addEventListener('contextmenu', e => e.preventDefault());

  return el;
}

function renderConnectionsBlock(state) {
  const block = document.getElementById('connections-block');
  const list = document.getElementById('connections-list');
  if (!block || !list) return;

  if (state === 'loading') {
    list.innerHTML = '<p id="connections-loading">Finding connections…</p>';
    block.classList.remove('hidden');
    return;
  }
  if (!state || state.length === 0) {
    block.classList.add('hidden');
    return;
  }
  list.innerHTML = state
    .map(c => `<div class="connection-item">${c.replace(/</g, '&lt;')}</div>`)
    .join('');
  block.classList.remove('hidden');
}

async function checkAndTriggerConnections() {
  // Need at least 5 notes and 10 saved cards
  if (notesArr.length < 5 || savedCardsMap.size < 10) return;

  // Check if already fetched this week
  const lastDate = await dbGetSetting('last_connection_date').catch(() => null);
  if (lastDate) {
    const diffDays = (Date.now() - new Date(lastDate).getTime()) / 86400000;
    if (diffDays < 7) {
      // Use cached result if available
      if (currentConnections) renderConnectionsBlock(currentConnections);
      return;
    }
  }

  // Trigger the call
  renderConnectionsBlock('loading');
  try {
    const notes = notesArr.slice(0, 30).map(n => n.text);
    const headlines = [...savedCardsMap.values()].slice(0, 30).map(c => c.headline).filter(Boolean);
    const res = await fetch('/api/connections', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes, headlines }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentConnections = data.connections || [];
    await dbPutSetting('last_connection_date', new Date().toISOString());
    renderConnectionsBlock(currentConnections);
  } catch (err) {
    console.warn('Connections fetch failed:', err.message);
    renderConnectionsBlock(null);
  }
}

function renderNotesPage() {
  const page = document.getElementById('notes-page');
  page.innerHTML = '';

  // Connections block placeholder (always rendered; shown/hidden dynamically)
  const connectionsEl = document.createElement('div');
  connectionsEl.id = 'connections-block';
  connectionsEl.className = 'hidden';
  connectionsEl.innerHTML = '<div id="connections-label">🔗 Connections</div><div id="connections-list"></div>';
  page.appendChild(connectionsEl);

  if (notesArr.length === 0) {
    const empty = document.createElement('div');
    empty.id = 'empty-notes';
    empty.innerHTML = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg><p>No notes yet.<br>Tap the pencil button to capture a thought.</p>`;
    page.appendChild(empty);
  } else {
    notesArr.forEach((n, i) => {
      const el = buildNoteCard(n);
      el.style.transitionDelay = `${Math.min(i * 35, 200)}ms`;
      page.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    });
  }

  // Kick off connections check (async, non-blocking)
  checkAndTriggerConnections().catch(() => {});
}

// ─────────────────────────────────────────────
// Save / unsave
// ─────────────────────────────────────────────
async function saveCard(card, saveTag, note = '') {
  const record = { ...card, saveTag, note };
  savedIds.add(card.id);
  savedCardsMap.set(card.id, record);
  await dbPut(record);
  logSignal('save', card.topic, saveTag);
}

async function unsaveCard(id) {
  savedIds.delete(id);
  savedCardsMap.delete(id);
  await dbDelete(id);
}

function updateBadges() {
  const rl = [...savedCardsMap.values()].filter(c => c.saveTag === READ_LATER_TAG).length;
  const sv = savedCardsMap.size - rl;
  document.getElementById('saved-count').textContent = sv || '0';
  document.getElementById('read-later-count').textContent = rl || '0';
  document.getElementById('notes-count').textContent = notesArr.length || '0';
}

// ─────────────────────────────────────────────
// Intent sheet
// ─────────────────────────────────────────────
let intentCard = null;
let intentCardEl = null;
let pendingTag = null;

function openIntentSheet(card, el) {
  intentCard = card;
  intentCardEl = el;
  pendingTag = null;
  // Reset to step 1
  document.getElementById('intent-options').classList.remove('hidden');
  document.getElementById('intent-note-step').classList.add('hidden');
  document.getElementById('intent-title').textContent = 'Save as…';
  document.getElementById('note-input').value = '';
  document.getElementById('intent-overlay').classList.add('open');
}

function closeIntentSheet() {
  document.getElementById('intent-overlay').classList.remove('open');
  intentCard = null; intentCardEl = null; pendingTag = null;
}

async function finishSave(note) {
  const card = intentCard, el = intentCardEl, tag = pendingTag;
  closeIntentSheet();
  if (!card || !el || !tag) return;
  await saveCard(card, tag, note);
  const saveBtn = el.querySelector('.save-btn');
  saveBtn.innerHTML = BOOKMARK_FILLED;
  saveBtn.classList.add('saved');
  saveBtn.setAttribute('aria-label', 'Unsave');
  updateBadges();
  if (activeTab === 'saved') renderSavedPage();
  else if (activeTab === 'read-later') renderReadLaterPage();
}

document.getElementById('intent-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('intent-overlay')) closeIntentSheet();
});
document.getElementById('intent-close').addEventListener('click', closeIntentSheet);

// Step 1 — pick intent
document.querySelectorAll('.intent-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    pendingTag = btn.dataset.tag;
    document.getElementById('intent-options').classList.add('hidden');
    document.getElementById('intent-note-step').classList.remove('hidden');
    document.getElementById('intent-title').textContent = 'Add a note (optional)';
    document.getElementById('note-input').focus();
  });
});

// Step 2 — note + confirm
document.getElementById('note-save-btn').addEventListener('click', () =>
  finishSave(document.getElementById('note-input').value.trim())
);
document.getElementById('note-skip-btn').addEventListener('click', () =>
  finishSave('')
);

// ─────────────────────────────────────────────
// Settings sheet
// ─────────────────────────────────────────────
const settingsOverlay = document.getElementById('settings-overlay');

function openSettingsSheet() {
  document.querySelectorAll('.style-opt').forEach(b =>
    b.classList.toggle('selected', b.dataset.style === readingStyle)
  );
  document.getElementById('interest-brief-input').value = interestBrief;
  settingsOverlay.classList.add('open');
}

function closeSettingsSheet() {
  settingsOverlay.classList.remove('open');
}

document.getElementById('settings-btn').addEventListener('click', openSettingsSheet);
document.getElementById('settings-close').addEventListener('click', closeSettingsSheet);
settingsOverlay.addEventListener('click', e => {
  if (e.target === settingsOverlay) closeSettingsSheet();
});

document.querySelectorAll('.style-opt').forEach(btn => {
  btn.addEventListener('click', async () => {
    readingStyle = btn.dataset.style;
    document.querySelectorAll('.style-opt').forEach(b =>
      b.classList.toggle('selected', b.dataset.style === readingStyle)
    );
    await dbPutSetting('reading_style', readingStyle);
  });
});

let briefSaveTimer = null;
document.getElementById('interest-brief-input').addEventListener('input', e => {
  interestBrief = e.target.value;
  clearTimeout(briefSaveTimer);
  briefSaveTimer = setTimeout(() => dbPutSetting('interest_brief', interestBrief).catch(() => {}), 600);
});

// ─────────────────────────────────────────────
// Quick capture sheet
// ─────────────────────────────────────────────
const captureOverlay = document.getElementById('capture-overlay');
const captureInput = document.getElementById('capture-input');
const captureSaveBtn = document.getElementById('capture-save-btn');

function openCaptureSheet() {
  captureInput.value = '';
  captureSaveBtn.disabled = true;
  captureOverlay.classList.add('open');
  // defer focus so iOS keyboard doesn't fight the sheet animation
  setTimeout(() => captureInput.focus(), 100);
}

function closeCaptureSheet() {
  captureOverlay.classList.remove('open');
  captureInput.blur();
}

captureInput.addEventListener('input', () => {
  captureSaveBtn.disabled = captureInput.value.trim().length === 0;
});

captureOverlay.addEventListener('click', e => {
  if (e.target === captureOverlay) closeCaptureSheet();
});
document.getElementById('capture-close').addEventListener('click', closeCaptureSheet);
document.getElementById('capture-fab').addEventListener('click', openCaptureSheet);

captureSaveBtn.addEventListener('click', async () => {
  const text = captureInput.value.trim();
  if (!text) return;
  const note = { id: `note-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, text, ts: Date.now() };
  notesArr.unshift(note);
  updateBadges();
  await dbPutNote(note);
  closeCaptureSheet();
  if (activeTab === 'notes') renderNotesPage();
});

// ─────────────────────────────────────────────
// Fetch feed
// ─────────────────────────────────────────────
async function loadFeed() {
  const page = document.getElementById('feed-page');
  const errBanner = document.getElementById('error-banner');
  const refreshBtn = document.getElementById('refresh-btn');

  errBanner.classList.add('hidden');
  document.getElementById('end-of-feed').classList.add('hidden');
  page.innerHTML = skeletonHTML();
  refreshBtn.classList.add('spinning');

  try {
    // Build personalization params
    const params = new URLSearchParams();
    const pref = computePreferredTopics();
    if (pref.length > 0) params.set('pref', pref.join(','));
    params.set('style', readingStyle);
    if (interestBrief.trim()) params.set('brief', interestBrief.trim().slice(0, 300));
    // Pass last 10 saved headlines for duplicate detection
    const recentHeadlines = [...savedCardsMap.values()]
      .slice(-10)
      .map(c => c.headline)
      .filter(Boolean);
    if (recentHeadlines.length > 0) params.set('seen', recentHeadlines.join('|'));

    const res = await fetch(`/api/feed?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Silently filter duplicate cards
    feedCards = (data.cards || []).filter(c => !c.duplicate);
    renderFeedPage(feedCards, data.daily_brief || '');
  } catch (err) {
    page.innerHTML = '';
    document.getElementById('error-msg').textContent = `Failed to load feed: ${err.message}`;
    errBanner.classList.remove('hidden');
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

// ─────────────────────────────────────────────
// Tabs
// ─────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const name = tab.dataset.tab;
    if (name === activeTab) return;
    activeTab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.getElementById('feed-page').classList.toggle('hidden', name !== 'feed');
    document.getElementById('end-of-feed').classList.toggle('hidden', name !== 'feed');
    document.getElementById('saved-page').classList.toggle('hidden', name !== 'saved');
    document.getElementById('read-later-page').classList.toggle('hidden', name !== 'read-later');
    document.getElementById('notes-page').classList.toggle('hidden', name !== 'notes');
    if (name === 'saved') renderSavedPage();
    else if (name === 'read-later') renderReadLaterPage();
    else if (name === 'notes') renderNotesPage();
  });
});

document.getElementById('refresh-btn').addEventListener('click', loadFeed);
document.getElementById('retry-btn').addEventListener('click', loadFeed);

// ─────────────────────────────────────────────
// "Give me 5 more"
// ─────────────────────────────────────────────
const TOPICS = ['tech', 'startups', 'science', 'design', 'finance', 'culture', 'sports'];
let lastMoreTopic = null;

document.getElementById('more-btn').addEventListener('click', async () => {
  const btn = document.getElementById('more-btn');
  btn.classList.add('loading');
  btn.disabled = true;

  // Pick a random topic, avoiding the same one twice in a row
  let topic;
  do { topic = TOPICS[Math.floor(Math.random() * TOPICS.length)]; }
  while (topic === lastMoreTopic && TOPICS.length > 1);
  lastMoreTopic = topic;

  try {
    const res = await fetch(`/api/feed?topic=${topic}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const newCards = (data.cards || []).slice(0, 5);
    if (newCards.length === 0) throw new Error('No cards returned');

    // Insert a divider before the new batch
    const page = document.getElementById('feed-page');
    const endEl = document.getElementById('end-of-feed');
    const divider = document.createElement('div');
    divider.className = 'more-divider';
    divider.textContent = topic;
    page.insertBefore(divider, endEl);

    // Append new cards before the end-of-feed block
    newCards.forEach((c, i) => {
      feedCards.push(c);
      const el = buildCard(c);
      el.style.transitionDelay = `${i * 50}ms`;
      page.insertBefore(el, endEl);
      // Trigger animation on next frame
      requestAnimationFrame(() => requestAnimationFrame(() => io.observe(el)));
    });

    document.getElementById('feed-count').textContent = feedCards.length;
  } catch (err) {
    console.error('load more error:', err);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

// ─────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────
(async () => {
  db = await openDB();
  const [savedArr, notesFromDB, signalsFromDB, storedStyle, storedBrief] = await Promise.all([
    dbGetAll(),
    dbGetAllNotes(),
    dbGetAllSignals(),
    dbGetSetting('reading_style'),
    dbGetSetting('interest_brief'),
  ]);
  savedArr.forEach(c => { savedIds.add(c.id); savedCardsMap.set(c.id, c); });
  notesArr = notesFromDB.sort((a, b) => b.ts - a.ts);
  signals = signalsFromDB;
  if (storedStyle) readingStyle = storedStyle;
  if (storedBrief) interestBrief = storedBrief;
  updateBadges();
  await loadFeed();
})();

// Service Worker
// ─────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
