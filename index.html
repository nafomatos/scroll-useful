<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pulse">
  <link rel="manifest" href="/manifest.json">
  <title>Pulse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --surface:   #111114;
      --border:    #1f1f23;
      --text:      #f0f0f0;
      --muted:     #888;
      --accent:    #fff;
      --radius:    18px;
      --safe-top:  env(safe-area-inset-top, 0px);
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    /* Topic palette */
    .tag-tech      { --tc:#60a5fa; --tb:rgba(96,165,250,.12); }
    .tag-startups  { --tc:#a78bfa; --tb:rgba(167,139,250,.12); }
    .tag-science   { --tc:#34d399; --tb:rgba(52,211,153,.12); }
    .tag-design    { --tc:#fbbf24; --tb:rgba(251,191,36,.12); }
    .tag-finance   { --tc:#22d3ee; --tb:rgba(34,211,238,.12); }
    .tag-culture   { --tc:#fb7185; --tb:rgba(251,113,133,.12); }
    .tag-sports    { --tc:#a3e635; --tb:rgba(163,230,53,.12); }

    html { background: var(--bg); }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overscroll-behavior-y: contain;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ────────────────────────────────── */
    #header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: calc(var(--safe-top) + 14px) 20px 0;
      background: rgba(8,8,8,.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
    }

    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    #logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #refresh-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, transform .4s;
      flex-shrink: 0;
    }
    #refresh-btn:active { transform: rotate(180deg); }
    #refresh-btn.spinning svg { animation: spin .7s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Tabs ──────────────────────────────────── */
    #tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      flex: 1;
      padding: 8px 0 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      position: relative;
      transition: color .2s;
      border-bottom: 2px solid transparent;
      letter-spacing: .01em;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }
    .tab .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--border);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      margin-left: 5px;
      vertical-align: middle;
      transition: background .2s, color .2s;
    }
    .tab.active .badge { background: var(--text); color: var(--bg); }

    /* ── Feed ──────────────────────────────────── */
    .feed-page {
      padding: 16px 16px calc(24px + var(--safe-bot));
      max-width: 680px;
      margin: 0 auto;
    }

    .feed-page.hidden { display: none; }

    /* ── Skeleton ──────────────────────────────── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
    }
    .skel {
      background: linear-gradient(90deg, #1f1f23 25%, #2a2a2e 50%, #1f1f23 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-img  { width: 100%; height: 200px; border-radius: 0; margin-bottom: 0; display: block; }
    .skel-body { padding: 14px 16px 13px; }
    .skel-tag  { width: 64px; height: 22px; margin-bottom: 14px; border-radius: 20px; }
    .skel-h1   { width: 90%; height: 18px; margin-bottom: 8px; }
    .skel-h2   { width: 70%; height: 18px; margin-bottom: 16px; }
    .skel-p1   { width: 100%; height: 13px; margin-bottom: 6px; }
    .skel-p2   { width: 85%;  height: 13px; margin-bottom: 6px; }
    .skel-p3   { width: 55%;  height: 13px; }

    /* ── Card ──────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity .35s ease,
        transform .35s ease,
        border-color .2s,
        background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .card:active { border-color: #2a2a30; }
    .card:active .card-body { background: #16161a; }

    /* thumbnail */
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #1a1a1e;
    }
    .card-thumbnail {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .3s ease;
    }
    .card-thumbnail.loaded { opacity: 1; }

    /* ▶ play overlay for video cards */
    .play-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,.72);
      border: 2px solid rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    .play-overlay svg { width: 20px; height: 20px; fill: #fff; margin-left: 3px; }

    /* content wrapper */
    .card-body {
      padding: 14px 16px 13px;
      transition: background .2s;
    }

    /* top row */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .topic-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--tb);
      color: var(--tc);
      border: 1px solid color-mix(in srgb, var(--tc) 20%, transparent);
    }

    .save-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, background .2s, border-color .2s, transform .15s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .save-btn:active { transform: scale(.88); }
    .save-btn.saved {
      color: #fbbf24;
      background: rgba(251,191,36,.1);
      border-color: rgba(251,191,36,.3);
    }
    .save-btn svg { width: 15px; height: 15px; }

    /* headline */
    .card-headline {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text);
      margin-bottom: 9px;
      letter-spacing: -.01em;
    }

    /* summary */
    .card-summary {
      font-size: 13.5px;
      line-height: 1.6;
      color: #aaa;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* bottom */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-meta {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-meta .dot {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: #444;
      flex-shrink: 0;
    }

    .read-link {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: color .2s;
      padding: 4px 0 4px 8px;
    }
    .read-link:hover { color: var(--text); }
    .read-link svg { width: 12px; height: 12px; }

    /* ── Empty saved ───────────────────────────── */
    #empty-saved {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    #empty-saved svg { opacity: .25; }
    #empty-saved p { font-size: 14px; line-height: 1.5; }

    /* ── Error ─────────────────────────────────── */
    #error-banner {
      display: none;
      margin: 16px 16px 0;
      padding: 14px 16px;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 12px;
      font-size: 13px;
      color: #f87171;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #error-banner.hidden { display: none; }
    #error-banner button {
      margin-left: auto;
      background: rgba(239,68,68,.2);
      border: none;
      border-radius: 8px;
      color: #f87171;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── End of feed ───────────────────────────── */
    #end-of-feed {
      text-align: center;
      padding: 28px 16px 8px;
    }
    #end-of-feed.hidden { display: none; }
    #caught-up {
      font-size: 13px;
      color: #444;
      font-weight: 500;
      letter-spacing: .02em;
      margin-bottom: 14px;
    }
    #more-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 20px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
    }
    #more-btn:active { background: #1a1a1e; }
    #more-btn:disabled { opacity: .4; cursor: default; }
    #more-btn .spin { animation: spin .7s linear infinite; display: none; }
    #more-btn.loading .spin { display: inline-block; }
    #more-btn.loading .label { display: none; }

    /* topic divider between batches */
    .more-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 12px;
      color: #333;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .more-divider::before, .more-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Carta do Momento ──────────────────────── */
    #carta {
      margin-bottom: 20px;
      padding: 16px 18px 18px;
      background: linear-gradient(135deg, rgba(96,165,250,.08) 0%, rgba(167,139,250,.06) 100%);
      border: 1px solid rgba(96,165,250,.18);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
    }
    #carta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top left, rgba(96,165,250,.07) 0%, transparent 60%);
      pointer-events: none;
    }
    #carta.hidden { display: none; }
    #carta-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(96,165,250,.7);
      margin-bottom: 10px;
    }
    #carta-label-icon {
      font-size: 14px;
      line-height: 1;
    }
    #carta-text {
      font-size: 14px;
      line-height: 1.75;
      color: #d4d4d4;
      font-style: normal;
      font-weight: 400;
    }
    #carta-read-more {
      display: inline;
      color: rgba(96,165,250,.6);
      font-style: normal;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 1px solid rgba(96,165,250,.25);
    }
    #carta-read-more:hover { color: rgba(96,165,250,.9); }

    /* ── Save tag pill + note ──────────────────── */
    .save-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 3px 9px;
      margin-top: 8px;
    }
    .card-note {
      font-size: 12.5px;
      color: #666;
      font-style: italic;
      margin-top: 6px;
      line-height: 1.45;
    }

    /* ── Intent note step ──────────────────────── */
    #intent-note-step { display: flex; flex-direction: column; gap: 10px; }
    #intent-note-step.hidden { display: none; }
    #note-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 12px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 76px;
    }
    #note-input:focus { border-color: #3a3a3e; }
    #note-input::placeholder { color: #444; }
    .note-actions {
      display: flex;
      gap: 8px;
    }
    #note-skip-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: #1f1f23;
      color: var(--muted);
      -webkit-tap-highlight-color: transparent;
    }
    #note-save-btn {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--text);
      color: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    #note-skip-btn:active { background: #2a2a2e; }
    #note-save-btn:active { background: #ccc; }

    /* ── Intent bottom sheet ───────────────────── */
    #intent-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #intent-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    #intent-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #intent-overlay.open #intent-sheet {
      transform: translateY(0);
    }
    #intent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    #intent-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .01em;
    }
    #intent-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #intent-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .intent-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #222;
      background: #111114;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: background .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
      width: 100%;
    }
    .intent-opt:active { background: #1f1f23; border-color: #333; }
    .intent-opt .emoji { font-size: 18px; line-height: 1; }

    /* ── Floating capture button ───────────────── */
    #capture-fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      z-index: 150;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.6);
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    #capture-fab:active { transform: scale(.92); box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    #capture-fab svg { width: 20px; height: 20px; }

    /* ── Capture bottom sheet ──────────────────── */
    #capture-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #capture-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    #capture-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #capture-overlay.open #capture-sheet { transform: translateY(0); }
    #capture-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    #capture-sheet-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    #capture-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #capture-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.55;
      padding: 11px 13px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 90px;
      margin-bottom: 10px;
    }
    #capture-input:focus { border-color: #3a3a3e; }
    #capture-input::placeholder { color: #444; }
    #capture-save-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--text);
      color: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    #capture-save-btn:active { background: #ccc; }
    #capture-save-btn:disabled { opacity: .35; cursor: default; }

    /* ── Note card (in Notes tab) ──────────────── */
    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .3s ease, transform .3s ease, border-color .2s, background .2s;
      user-select: none;
      -webkit-user-select: none;
    }
    .note-card.visible { opacity: 1; transform: translateY(0); }
    .note-card.deleting {
      opacity: 0;
      transform: scale(.95);
      transition: opacity .2s ease, transform .2s ease;
    }
    .note-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .note-card-text {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
    }
    .note-card-time {
      font-size: 11.5px;
      color: #555;
      font-weight: 500;
    }
    .note-delete-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #444;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .note-delete-btn:active { color: #f87171; background: rgba(239,68,68,.1); }
    .note-delete-btn svg { width: 13px; height: 13px; }
    .note-confirm {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--muted);
    }
    .note-confirm.hidden { display: none; }
    .note-confirm span { flex: 1; }
    .note-confirm-yes, .note-confirm-no {
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .note-confirm-yes { background: rgba(239,68,68,.15); color: #f87171; }
    .note-confirm-no  { background: rgba(255,255,255,.06); color: var(--muted); }
    .note-confirm-yes:active { background: rgba(239,68,68,.25); }
    .note-confirm-no:active  { background: rgba(255,255,255,.1); }

    /* ── Mindset block ("Your mind right now") ─── */
    #mindset-block {
      margin-bottom: 16px;
      padding: 14px 16px;
      border-left: 3px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.02);
      border-radius: 0 12px 12px 0;
    }
    #mindset-block.hidden { display: none; }
    #mindset-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 8px;
    }
    #mindset-text {
      font-size: 13px;
      line-height: 1.65;
      color: #888;
      font-style: italic;
    }
    #empty-notes {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    #empty-notes svg { opacity: .25; }
    #empty-notes p { font-size: 14px; line-height: 1.5; }

    /* ── Settings button ───────────────────────── */
    #settings-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s;
      flex-shrink: 0;
    }
    #settings-btn svg { width: 15px; height: 15px; }
    #header-actions { display: flex; gap: 8px; align-items: center; }

    /* ── Settings bottom sheet ─────────────────── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }
    #settings-sheet {
      width: 100%;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #2a2a2e;
      padding: 12px 16px calc(28px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,1,.23,1);
    }
    #settings-overlay.open #settings-sheet { transform: translateY(0); }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    #settings-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none;
      background: #2a2a2e;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .settings-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
    }
    .style-options { display: flex; flex-direction: column; gap: 6px; }
    .style-opt {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid #222;
      background: #111114;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text);
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
      width: 100%;
    }
    .style-opt:active { background: #1f1f23; }
    .style-opt.selected {
      border-color: rgba(255,255,255,.3);
      background: rgba(255,255,255,.06);
    }
    .style-opt .style-radio {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid #444;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .style-opt.selected .style-radio {
      border-color: var(--text);
      background: var(--text);
    }
    .style-opt.selected .style-radio::after {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--bg);
    }
    .style-opt-label { flex: 1; font-weight: 500; }
    .style-opt-desc { font-size: 11.5px; color: #555; margin-top: 1px; }
    #interest-brief-input {
      width: 100%;
      background: #111114;
      border: 1px solid #2a2a2e;
      border-radius: 10px;
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.55;
      padding: 10px 12px;
      resize: none;
      font-family: inherit;
      outline: none;
      min-height: 72px;
    }
    #interest-brief-input:focus { border-color: #3a3a3e; }
    #interest-brief-input::placeholder { color: #444; }

    /* ── Connections block (Notes tab) ─────────── */
    #connections-block {
      margin-bottom: 20px;
      padding: 14px 16px;
      border-left: 3px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.02);
      border-radius: 0 12px 12px 0;
    }
    #connections-block.hidden { display: none; }
    #connections-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 10px;
    }
    .connection-item {
      font-size: 13px;
      line-height: 1.65;
      color: #999;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a1d;
    }
    .connection-item:last-child { border-bottom: none; padding-bottom: 0; }
    #connections-loading {
      font-size: 12px;
      color: #444;
      font-style: italic;
    }

    /* ── Fixture block (Sofascore-style grouped by competition) ── */
    .fixture-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .35s ease, transform .35s ease;
      cursor: default;
    }
    .fixture-block.visible { opacity: 1; transform: translateY(0); }
    .fixture-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    .fixture-block-league-logo {
      width: 16px; height: 16px;
      object-fit: contain;
      opacity: .8;
      flex-shrink: 0;
    }
    .fixture-block-league-name {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #666;
    }
    .fixture-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,.035);
    }
    .fixture-row:last-child { border-bottom: none; }
    .fixture-row-time {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      min-width: 34px;
      flex-shrink: 0;
      line-height: 1;
      text-align: right;
    }
    .fixture-row-time.is-live { color: #ef4444; }
    .fixture-row-teams {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .fixture-row-team {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1;
    }
    .fixture-row-team img {
      width: 17px; height: 17px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .fixture-row-team-ph {
      width: 17px; height: 17px;
      border-radius: 50%;
      background: #222;
      flex-shrink: 0;
    }
    .fixture-row-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 20px;
      flex-shrink: 0;
    }
    .fixture-row-score span {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .fixture-live-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #ef4444;
      animation: fxpulse 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes fxpulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Pull to refresh ─────────────────────────── */
    #pull-indicator {
      position: fixed;
      top: calc(var(--safe-top) + 62px);
      left: 50%; transform: translateX(-50%) translateY(-80px);
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      transition: transform .25s ease, opacity .25s;
      opacity: 0; z-index: 90; pointer-events: none;
    }
    #pull-indicator.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    #pull-indicator svg { animation: spin .7s linear infinite; }

    /* ── Search button ───────────────────────────── */
    #search-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s; flex-shrink: 0;
    }

    /* ── Search overlay ──────────────────────────── */
    #search-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(8,8,8,.97);
      display: flex; flex-direction: column;
      padding: calc(var(--safe-top) + 16px) 16px 16px;
      transform: translateY(100%); transition: transform .3s ease;
    }
    #search-overlay.open { transform: translateY(0); }
    #search-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    #search-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
      color: var(--text); font-size: 15px; font-family: inherit; outline: none;
    }
    #search-input:focus { border-color: #3a3a3e; }
    #search-cancel {
      background: none; border: none; color: var(--muted);
      font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px; white-space: nowrap;
    }
    #search-results { flex: 1; overflow-y: auto; }
    .search-result { padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .search-result:last-child { border-bottom: none; }
    .search-result-type {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #555; margin-bottom: 4px;
    }
    .search-result-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
    .search-result-snippet {
      font-size: 12px; color: var(--muted); margin-top: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #search-empty { text-align: center; padding: 60px 20px; color: #444; font-size: 14px; }

    /* ── Trending strip ──────────────────────────── */
    #trending-strip {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 0 14px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-bottom: 4px;
    }
    #trending-strip::-webkit-scrollbar { display: none; }
    .trend-chip {
      flex-shrink: 0; padding: 5px 12px; border-radius: 99px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 12px; font-weight: 600; color: var(--muted);
      cursor: pointer; white-space: nowrap; transition: background .15s, color .15s;
    }
    .trend-chip:active { background: #1f1f23; color: var(--text); }

    /* ── Ask the feed ────────────────────────────── */
    #ask-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    #ask-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 14px;
      color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    }
    #ask-input:focus { border-color: #3a3a3e; }
    #ask-input::placeholder { color: #444; }
    #ask-btn {
      padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap; transition: color .2s, background .2s;
    }
    #ask-btn:disabled { opacity: .4; cursor: default; }
    #ask-answer {
      margin-bottom: 14px; padding: 12px 14px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px; font-size: 13.5px; line-height: 1.65; color: #bbb; display: none;
    }
    #ask-answer.visible { display: block; }

    /* ── Topic chips (settings) ──────────────────── */
    #topic-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .topic-chip {
      padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .topic-chip.active {
      background: rgba(255,255,255,.1); color: var(--text); border-color: rgba(255,255,255,.25);
    }

    /* ── Language toggle ─────────────────────────── */
    #lang-toggle-row {
      display: flex; align-items: center;
      justify-content: space-between; padding: 12px 0 4px;
    }
    #lang-toggle-text { line-height: 1.4; }
    #lang-toggle-label { font-size: 13.5px; color: var(--text); }
    #lang-toggle-sub { font-size: 11.5px; color: #555; }
    .toggle-switch { position: relative; width: 44px; height: 26px; flex-shrink: 0; cursor: pointer; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 13px;
      background: #2a2a2e; transition: background .2s;
    }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #666; transition: transform .2s, background .2s; pointer-events: none;
    }
    .toggle-switch input:checked ~ .toggle-track { background: rgba(255,255,255,.15); }
    .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(18px); background: var(--text); }

    /* ── Card swipe feedback ─────────────────────── */
    .card { touch-action: pan-y; }
    .card.swipe-right { background: rgba(163,230,53,.07); border-color: rgba(163,230,53,.25); }
    .card.swipe-left  { background: rgba(239,68,68,.06);  border-color: rgba(239,68,68,.2); }

    /* ── Cluster stack ───────────────────────────── */
    .cluster-stack { position: relative; margin-bottom: 12px; }
    .cluster-stack > .card { margin-bottom: 0; }
    .cluster-behind {
      position: absolute; top: 6px; left: 4px; right: 4px; bottom: -6px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); z-index: -1;
    }
    .cluster-behind-2 {
      position: absolute; top: 10px; left: 8px; right: 8px; bottom: -10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); z-index: -2;
    }
    .cluster-expand-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; margin-top: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--muted); font-size: 12px; font-weight: 600;
      cursor: pointer; width: 100%; transition: background .15s, color .15s;
    }
    .cluster-expand-btn:active { background: #1f1f23; }
    .cluster-hidden-cards { display: none; }
    .cluster-hidden-cards.open { display: block; }

    /* ── Sports page ─────────────────────────────── */
    #sports-page .sports-rss-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 16px 0 12px; color: #333; font-size: 11px;
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }
    #sports-page .sports-rss-divider::before, #sports-page .sports-rss-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div id="logo">Pulse</div>
    <div id="header-actions">
      <button id="search-btn" aria-label="Search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
      <button id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="refresh-btn" aria-label="Refresh">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="feed">Feed <span class="badge" id="feed-count">—</span></button>
    <button class="tab" data-tab="sports">Sports</button>
    <button class="tab" data-tab="saved">Saved <span class="badge" id="saved-count">0</span></button>
    <button class="tab" data-tab="read-later">Later <span class="badge" id="read-later-count">0</span></button>
    <button class="tab" data-tab="notes">Notes <span class="badge" id="notes-count">0</span></button>
  </div>
</div>

<div id="intent-overlay">
  <div id="intent-sheet">
    <div id="intent-header">
      <span id="intent-title">Save as…</span>
      <button id="intent-close" aria-label="Dismiss">×</button>
    </div>
    <div id="intent-options">
      <button class="intent-opt" data-tag="💡 Interesting"><span class="emoji">💡</span> Interesting</button>
      <button class="intent-opt" data-tag="📌 Read later"><span class="emoji">📌</span> Read later</button>
      <button class="intent-opt" data-tag="🔍 Research"><span class="emoji">🔍</span> Research</button>
      <button class="intent-opt" data-tag="💼 Work relevant"><span class="emoji">💼</span> Work relevant</button>
      <button class="intent-opt" data-tag="🗣️ Share"><span class="emoji">🗣️</span> Share</button>
    </div>
    <div id="intent-note-step" class="hidden">
      <textarea id="note-input" placeholder="Add your thought…"></textarea>
      <div class="note-actions">
        <button id="note-skip-btn">Skip</button>
        <button id="note-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="settings-overlay">
  <div id="settings-sheet">
    <div class="settings-header">
      <span class="settings-title">Reading style</span>
      <button id="settings-close" aria-label="Close">×</button>
    </div>
    <p class="settings-section-label">How should Claude summarise articles?</p>
    <div class="style-options">
      <button class="style-opt" data-style="direct">
        <span class="style-radio"></span>
        <span><div class="style-opt-label">Direct &amp; concise</div><div class="style-opt-desc">Key facts only, no fluff</div></span>
      </button>
      <button class="style-opt" data-style="narrative">
        <span class="style-radio"></span>
        <span><div class="style-opt-label">Narrative &amp; contextual</div><div class="style-opt-desc">Story-driven, bigger picture</div></span>
      </button>
      <button class="style-opt" data-style="analytical">
        <span class="style-radio"></span>
        <span><div class="style-opt-label">Analytical</div><div class="style-opt-desc">Implications, tensions, what to watch</div></span>
      </button>
      <button class="style-opt" data-style="casual">
        <span class="style-radio"></span>
        <span><div class="style-opt-label">Casual</div><div class="style-opt-desc">Like a smart friend explaining it</div></span>

<script>
// ─────────────────────────────────────────────
// IndexedDB
// ─────────────────────────────────────────────
const DB_NAME = 'pulse-db', DB_VER = 3, STORE = 'saved', NOTES_STORE = 'notes';
const SIGNALS_STORE = 'signals', SETTINGS_STORE = 'settings';
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(NOTES_STORE))
        d.createObjectStore(NOTES_STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(SIGNALS_STORE))
        d.createObjectStore(SIGNALS_STORE, { keyPath: 'id' });
      if (!d.objectStoreNames.contains(SETTINGS_STORE))
        d.createObjectStore(SETTINGS_STORE, { keyPath: 'key' });
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbGetAll() {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const r = tx.objectStore(STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPut(card) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(card);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbGetAllNotes() {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readonly');
    const r = tx.objectStore(NOTES_STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPutNote(note) {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readwrite');
    tx.objectStore(NOTES_STORE).put(note);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbDeleteNote(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction(NOTES_STORE, 'readwrite');
    tx.objectStore(NOTES_STORE).delete(id);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbPutSignal(signal) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SIGNALS_STORE, 'readwrite');
    tx.objectStore(SIGNALS_STORE).put(signal);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

function dbGetAllSignals() {
  return new Promise((res, rej) => {
    const tx = db.transaction(SIGNALS_STORE, 'readonly');
    const r = tx.objectStore(SIGNALS_STORE).getAll();
    r.onsuccess = e => res(e.target.result);
    r.onerror = e => rej(e.target.error);
  });
}

function dbGetSetting(key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SETTINGS_STORE, 'readonly');
    const r = tx.objectStore(SETTINGS_STORE).get(key);
    r.onsuccess = e => res(e.target.result?.value ?? null);
    r.onerror = e => rej(e.target.error);
  });
}

function dbPutSetting(key, value) {
  return new Promise((res, rej) => {
    const tx = db.transaction(SETTINGS_STORE, 'readwrite');
    tx.objectStore(SETTINGS_STORE).put({ key, value });
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e.target.error);
  });
}

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let feedCards = [];
let sportsRssCards = []; // sports-topic RSS cards, shown in Sports tab
let savedIds = new Set();
let savedCardsMap = new Map(); // id → full card object (includes saveTag)
let activeTab = 'feed';
let notesArr = []; // [{id, text, ts}] sorted newest-first
let signals = []; // [{id, type:'save'|'read', topic, intent?, ts}]
let readingStyle = 'direct'; // persisted in settings
let interestBrief = ''; // persisted in settings as interest_brief
let mindsetSummary = ''; // cached "Your mind right now" summary
let mindsetNoteCount = -1; // note count at last mindset generation (-1 = never)
let currentConnections = null; // cached connections result
const ALL_TOPICS = ['tech', 'startups', 'science', 'design', 'finance', 'culture', 'sports'];
let customTopics = [...ALL_TOPICS]; // active topics — persisted as custom_topics
let showPt = false; // include PT-language feeds — persisted as show_pt

// ─────────────────────────────────────────────
// Utils
// ─────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// Returns top-2 preferred topics based on save (weight 2) + read (weight 1) signals
function computePreferredTopics() {
  const scores = {};
  signals.forEach(s => {
    if (!s.topic) return;
    scores[s.topic] = (scores[s.topic] || 0) + (s.type === 'save' ? 2 : 1);
  });
  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 2)
    .map(([t]) => t);
}

function logSignal(type, topic, intent = null) {
  const sig = { id: `sig-${Date.now()}-${Math.random().toString(36).slice(2,6)}`, type, topic, intent, ts: Date.now() };
  signals.push(sig);
  dbPutSignal(sig).catch(() => {});
}

const BOOKMARK_EMPTY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const BOOKMARK_FILLED = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
const ARROW_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>`;

// ─────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────
function buildCard(card) {
  const saved = savedIds.has(card.id);
  const slug = (card.topic || '').toLowerCase().replace(/\s+/g, '-');

  const el = document.createElement('article');
  el.className = `card tag-${slug}`;
  el.dataset.id = card.id;

  const playIcon = card.type === 'video'
    ? `<div class="play-overlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`
    : '';
  const thumbHTML = card.thumbnail
    ? `<div class="card-thumb-wrap">
         <img class="card-thumbnail" src="${card.thumbnail}" alt="" loading="lazy" decoding="async">
         ${playIcon}
       </div>`
    : '';

  const savedCard = savedCardsMap.get(card.id) || null;
  const tagHTML = savedCard?.saveTag
    ? `<span class="save-tag">${savedCard.saveTag}</span>`
    : '';
  const noteHTML = savedCard?.note
    ? `<p class="card-note">${savedCard.note}</p>`
    : '';

  el.innerHTML = `
    ${thumbHTML}
    <div class="card-body">
      <div class="card-top">
        <span class="topic-tag">${card.topic}</span>
        <button class="save-btn ${saved ? 'saved' : ''}" data-id="${card.id}" aria-label="${saved ? 'Unsave' : 'Save'}">
          ${saved ? BOOKMARK_FILLED : BOOKMARK_EMPTY}
        </button>
      </div>
      <h2 class="card-headline">${card.headline}</h2>
      <p class="card-summary">${card.summary}</p>
      <div class="card-bottom">
        <div class="card-meta">
          <span>${card.source}</span>
          ${card.pubDate ? `<span class="dot"></span><span>${timeAgo(card.pubDate)}</span>` : ''}
        </div>
        <a class="read-link" href="${card.link}" target="_blank" rel="noopener" aria-label="Read article">Read ${ARROW_SVG}</a>
      </div>
      ${tagHTML}
      ${noteHTML}
    </div>
  `;

  // Fade image in once loaded; hide whole wrapper on error
  if (card.thumbnail) {
    const img = el.querySelector('.card-thumbnail');
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => {
      const wrap = el.querySelector('.card-thumb-wrap');
      if (wrap) wrap.style.display = 'none';
    });
  }

  // save button — if already saved, unsave directly; otherwise open intent sheet
  el.querySelector('.save-btn').addEventListener('click', async e => {
    e.stopPropagation();
    if (savedIds.has(card.id)) {
      await unsaveCard(card.id);
      const btn = el.querySelector('.save-btn');
      btn.innerHTML = BOOKMARK_EMPTY;
      btn.classList.remove('saved');
      btn.setAttribute('aria-label', 'Save');
      updateBadges();
      if (activeTab === 'saved') renderSavedPage();
      else if (activeTab === 'read-later') renderReadLaterPage();
    } else {
      openIntentSheet(card, el);
    }
  });

  // card tap → log read signal + open link
  el.addEventListener('click', () => {
    logSignal('read', card.topic);
    window.open(card.link, '_blank', 'noopener');
  });

  // prevent read-link double-open
  el.querySelector('.read-link').addEventListener('click', e => e.stopPropagation());

  return el;
}

function skeletonHTML() {
  return Array.from({ length: 5 }, (_, i) => `
    <div class="skeleton-card">
      ${i % 2 === 0 ? '<div class="skel skel-img"></div>' : ''}
      <div class="skel-body">
        <div class="skel skel-tag"></div>
        <div class="skel skel-h1"></div>
        <div class="skel skel-h2"></div>
        <div class="skel skel-p1"></div>
        <div class="skel skel-p2"></div>
        <div class="skel skel-p3"></div>
      </div>
    </div>
  `).join('');
}

// Intersection observer for entrance animations
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
}, { threshold: 0.05 });

function buildTrendingStrip(cards) {
  const stop = new Set(['the','a','an','and','of','in','to','for','on','is','are','was','were','it','this','that','with','at','by','from','as','be','has','have','had','will','or','but','not','its','their','than','also','been','about','they','he','she','we','his','her','our','new','more','over','after','into','when','who','what','how']);
  const freq = {};
  cards.forEach(c => {
    const text = ((c.headline || '') + ' ' + (c.summary || '')).toLowerCase();
    text.match(/\b[a-z][a-z'-]{2,}\b/g)?.forEach(w => {
      if (!stop.has(w)) freq[w] = (freq[w] || 0) + 1;
    });
  });
  const top = Object.entries(freq).filter(([,n]) => n > 1).sort((a,b) => b[1]-a[1]).slice(0, 12).map(([w]) => w);
  if (top.length === 0) return null;
  const strip = document.createElement('div');
  strip.id = 'trending-strip';
  top.forEach(word => {
    const chip = document.createElement('button');
    chip.className = 'trend-chip';
    chip.textContent = word;
    chip.addEventListener('click', () => {
      const q = word;
      document.getElementById('search-input').value = q;
      document.getElementById('search-overlay').classList.add('open');
      runSearch(q);
    });
    strip.appendChild(chip);
  });
  return strip;
}

function renderFeedPage(cards, dailyBrief) {
  // Separate sports RSS cards into their own bucket
  sportsRssCards = cards.filter(c => c.topic === 'sports');
  const feedOnly = clusterFeedCards(cards.filter(c => c.topic !== 'sports'));

  const page = document.getElementById('feed-page');
  // Preserve #carta element across innerHTML wipes
  const cartaEl = document.getElementById('carta') || (() => {
    const d = document.createElement('div'); d.id = 'carta'; d.className = 'hidden';
    d.innerHTML = '<div id="carta-label"><span id="carta-label-icon">🌅</span> Morning Brief</div><p id="carta-text"></p>';
    return d;
  })();
  page.innerHTML = '';
  page.appendChild(cartaEl);

  if (dailyBrief) {
    const cartaText = document.getElementById('carta-text');
    // Split into sentences and truncate at 3
    const sentenceRe = /[^.!?]*[.!?]+(\s|$)/g;
    const sentences = dailyBrief.match(sentenceRe) || [dailyBrief];
    const preview = sentences.slice(0, 3).join('').trimEnd();
    const rest = dailyBrief.slice(preview.length).trimStart();
    if (rest) {
      const restSpan = document.createElement('span');
      restSpan.textContent = ' ' + rest;
      restSpan.style.display = 'none';
      const readMore = document.createElement('span');
      readMore.id = 'carta-read-more';
      readMore.textContent = ' Read more';
      readMore.addEventListener('click', () => {
        restSpan.style.display = 'inline';
        readMore.remove();
      });
      cartaText.textContent = '';
      cartaText.appendChild(document.createTextNode(preview));
      cartaText.appendChild(restSpan);
      cartaText.appendChild(readMore);
    } else {
      cartaText.textContent = dailyBrief;
    }
    cartaEl.classList.remove('hidden');
  } else {
    cartaEl.classList.add('hidden');
  }

  // Trending strip — flatten clusters back to cards for keyword analysis
  const trendEl = buildTrendingStrip(feedOnly.flatMap(x => x._isCluster ? x.cards : [x]));
  if (trendEl) page.appendChild(trendEl);

  // Ask the feed bar
  const askBar = document.createElement('div');
  askBar.id = 'ask-bar';
  askBar.innerHTML = `<input id="ask-input" type="text" placeholder="Ask about today's news…"><button id="ask-btn">Ask</button>`;
  page.appendChild(askBar);
  const askAnswer = document.createElement('div');
  askAnswer.id = 'ask-answer';
  page.appendChild(askAnswer);
  document.getElementById('ask-btn').addEventListener('click', handleAskFeed);
  document.getElementById('ask-input').addEventListener('keydown', e => { if (e.key === 'Enter') handleAskFeed(); });

  let cardCount = 0;
  feedOnly.forEach((item, i) => {
    if (item._isCluster) {
      // Render cluster stack
      const wrap = document.createElement('div');
      wrap.className = 'cluster-stack';
      if (item.cards.length >= 3) wrap.appendChild(Object.assign(document.createElement('div'), { className: 'cluster-behind-2' }));
      if (item.cards.length >= 2) wrap.appendChild(Object.assign(document.createElement('div'), { className: 'cluster-behind' }));
      const topEl = buildCard(item.cards[0]);
      topEl.style.transitionDelay = `${Math.min(i * 40, 300)}ms`;
      wrap.appendChild(topEl);
      io.observe(topEl);
      if (item.cards.length > 1) {
        const hidden = document.createElement('div');
        hidden.className = 'cluster-hidden-cards';
        item.cards.slice(1).forEach((c2, j) => {
          const el2 = buildCard(c2);
          el2.style.transitionDelay = `${j * 40}ms`;
          hidden.appendChild(el2);
        });
        const expandBtn = document.createElement('button');
        expandBtn.className = 'cluster-expand-btn';
        expandBtn.textContent = `+${item.cards.length - 1} related`;
        expandBtn.addEventListener('click', () => {
          hidden.classList.toggle('open');
          expandBtn.textContent = hidden.classList.contains('open') ? 'Show less' : `+${item.cards.length - 1} related`;
          if (hidden.classList.contains('open')) {
            hidden.querySelectorAll('.card').forEach(el2 => io.observe(el2));
          }
        });
        wrap.appendChild(hidden);
        wrap.appendChild(expandBtn);
      }
      page.appendChild(wrap);
      cardCount += item.cards.length;
    } else {
      const el = buildCard(item);
      el.style.transitionDelay = `${Math.min(i * 40, 300)}ms`;
      page.appendChild(el);
      io.observe(el);
      cardCount++;
    }
  });
  document.getElementById('feed-count').textContent = cardCount || '—';
  document.getElementById('end-of-feed').classList.remove('hidden');
}

const READ_LATER_TAG = '📌 Read later';

function renderSavedPage() {
  const page = document.getElementById('saved-page');
  page.innerHTML = '';
  const cards = [...savedCardsMap.values()].filter(c => c.saveTag !== READ_LATER_TAG);
  if (cards.length === 0) {
    page.innerHTML = emptyHTML('Nothing saved yet.<br>Tap the bookmark on any card.');
    return;
  }
  cards.forEach((c, i) => {
    const el = buildCard(c);
    el.style.transitionDelay = `${Math.min(i * 40, 200)}ms`;
    page.appendChild(el);
    io.observe(el);
  });
}

function renderReadLaterPage() {
  const page = document.getElementById('read-later-page');
  page.innerHTML = '';
  const cards = [...savedCardsMap.values()].filter(c => c.saveTag === READ_LATER_TAG);
  if (cards.length === 0) {
    page.innerHTML = emptyHTML('Nothing queued.<br>Save articles with 📌 Read later.');
    return;
  }
  cards.forEach((c, i) => {
    const el = buildCard(c);
    el.style.transitionDelay = `${Math.min(i * 40, 200)}ms`;
    page.appendChild(el);
    io.observe(el);
  });
}

function emptyHTML(msg) {
  return `<div id="empty-saved">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    <p>${msg}</p>
  </div>`;
}

async function renderSportsPage() {
  const page = document.getElementById('sports-page');
  page.innerHTML = '';
  // Inject live fixtures first
  await loadFixtures(page);
  // Then sports RSS cards
  if (sportsRssCards.length > 0) {
    const divider = document.createElement('div');
    divider.className = 'sports-rss-divider';
    divider.textContent = 'News';
    page.appendChild(divider);
    sportsRssCards.forEach((c, i) => {
      const el = buildCard(c);
      el.style.transitionDelay = `${Math.min(i * 40, 200)}ms`;
      page.appendChild(el);
      io.observe(el);
    });
  } else if (!page.querySelector('.fixture-block')) {
    page.innerHTML = emptyHTML('No sports content today.<br>Check back later.');
  }
}

function formatNoteTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const days = Math.floor(h / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

const TRASH_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;

async function deleteNote(id, el) {
  el.classList.add('deleting');
  await dbDeleteNote(id);
  notesArr = notesArr.filter(n => n.id !== id);
  updateBadges();
  // Invalidate mindset cache so it refreshes next time Notes tab opens
  mindsetNoteCount = -1;
  setTimeout(() => el.remove(), 220);
}

function buildNoteCard(note) {
  const el = document.createElement('div');
  el.className = 'note-card';
  el.dataset.id = note.id;
  el.innerHTML = `
    <div class="note-card-header">
      <div class="note-card-time">${formatNoteTime(note.ts)}</div>
      <button class="note-delete-btn" aria-label="Delete note">${TRASH_SVG}</button>
    </div>
    <div class="note-card-text">${note.text.replace(/</g, '&lt;')}</div>
    <div class="note-confirm hidden">
      <span>Delete this note?</span>
      <button class="note-confirm-no">No</button>
      <button class="note-confirm-yes">Yes</button>
    </div>
  `;

  const confirmEl = el.querySelector('.note-confirm');
  const deleteBtn = el.querySelector('.note-delete-btn');

  deleteBtn.addEventListener('click', e => {
    e.stopPropagation();
    confirmEl.classList.remove('hidden');
    deleteBtn.style.display = 'none';
  });
  el.querySelector('.note-confirm-no').addEventListener('click', e => {
    e.stopPropagation();
    confirmEl.classList.add('hidden');
    deleteBtn.style.display = '';
  });
  el.querySelector('.note-confirm-yes').addEventListener('click', async e => {
    e.stopPropagation();
    await deleteNote(note.id, el);
  });

  return el;
}

function renderMindsetBlock(state) {
  const block = document.getElementById('mindset-block');
  const text = document.getElementById('mindset-text');
  if (!block || !text) return;
  if (!state || notesArr.length < 3) { block.classList.add('hidden'); return; }
  if (state === 'loading') {
    text.textContent = 'Thinking…';
    block.classList.remove('hidden');
    return;
  }
  text.textContent = state;
  block.classList.remove('hidden');
}

async function checkAndRefreshMindset() {
  if (notesArr.length < 3) return;
  // Already up to date
  if (notesArr.length === mindsetNoteCount && mindsetSummary) {
    renderMindsetBlock(mindsetSummary);
    return;
  }
  renderMindsetBlock('loading');
  try {
    const res = await fetch('/api/mindset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes: notesArr.map(n => n.text) }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    mindsetSummary = data.summary || '';
    mindsetNoteCount = notesArr.length;
    await Promise.all([
      dbPutSetting('mindset_summary', mindsetSummary),
      dbPutSetting('mindset_note_count', mindsetNoteCount),
    ]);
    renderMindsetBlock(mindsetSummary);
  } catch (err) {
    console.warn('Mindset fetch failed:', err.message);
    renderMindsetBlock(mindsetSummary || null);
  }
}

function renderConnectionsBlock(state) {
  const block = document.getElementById('connections-block');
  const list = document.getElementById('connections-list');
  if (!block || !list) return;

  if (state === 'loading') {
    list.innerHTML = '<p id="connections-loading">Finding connections…</p>';
    block.classList.remove('hidden');
    return;
  }
  if (!state || state.length === 0) {
    block.classList.add('hidden');
    return;
  }
  list.innerHTML = state
    .map(c => `<div class="connection-item">${c.replace(/</g, '&lt;')}</div>`)
    .join('');
  block.classList.remove('hidden');
}

async function checkAndTriggerConnections() {
  // Need at least 5 notes and 10 saved cards
  if (notesArr.length < 5 || savedCardsMap.size < 10) return;

  // Check if already fetched this week
  const lastDate = await dbGetSetting('last_connection_date').catch(() => null);
  if (lastDate) {
    const diffDays = (Date.now() - new Date(lastDate).getTime()) / 86400000;
    if (diffDays < 7) {
      // Use cached result if available
      if (currentConnections) renderConnectionsBlock(currentConnections);
      return;
    }
  }

  // Trigger the call
  renderConnectionsBlock('loading');
  try {
    const notes = notesArr.slice(0, 30).map(n => n.text);
    const headlines = [...savedCardsMap.values()].slice(0, 30).map(c => c.headline).filter(Boolean);
    const res = await fetch('/api/connections', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes, headlines }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentConnections = data.connections || [];
    await dbPutSetting('last_connection_date', new Date().toISOString());
    renderConnectionsBlock(currentConnections);
  } catch (err) {
    console.warn('Connections fetch failed:', err.message);
    renderConnectionsBlock(null);
  }
}

function renderNotesPage() {
  const page = document.getElementById('notes-page');
  page.innerHTML = '';

  const mindsetEl = document.createElement('div');
  mindsetEl.id = 'mindset-block';

  page.appendChild(connectionsEl);

    const empty = document.createElement('div');
    empty.id = 'empty-notes';
    empty.innerHTML = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg><p>No notes yet.<br>Tap the pencil button to capture a thought.</p>`;
    page.appendChild(empty);
  } else {
    notesArr.forEach((n, i) => {
      const el = buildNoteCard(n);
      el.style.transitionDelay = `${Math.min(i * 35, 200)}ms`;
      page.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));

  // Kick off mindset + connections checks (async, non-blocking)
  checkAndRefreshMindset().catch(() => {});
  checkAndTriggerConnections().catch(() => {});
}

function buildLeagueFixtureBlock(leagueName, leagueLogo, fixtures) {
  const el = document.createElement('article');
  el.className = 'fixture-block tag-sports';

  const headerLogo = leagueLogo
    ? `<img class="fixture-block-league-logo" src="${leagueLogo}" alt="" loading="lazy">`
    : '';

  const logoImg = src => src
    ? `<img src="${src}" alt="" loading="lazy">`
    : `<div class="fixture-row-team-ph"></div>`;

  const rows = fixtures.map(f => {
    const live     = f.status === 'live';
    const finished = f.status === 'finished';
    const pst      = f.status === 'postponed';

    let timeCell;
    if (live)     timeCell = `<div class="fixture-row-time is-live">${f.elapsed != null ? `${f.elapsed}'` : 'LIVE'}</div>`;
    else if (finished) timeCell = `<div class="fixture-row-time">FT</div>`;
    else if (pst) timeCell = `<div class="fixture-row-time" style="color:#555;font-size:10px">PST</div>`;
    else          timeCell = `<div class="fixture-row-time">${f.kickoff}</div>`;

    const scoreCell = (live || finished) ? `
      <div class="fixture-row-score">
        <span>${f.homeScore ?? 0}</span>
        <span>${f.awayScore ?? 0}</span>
      </div>` : (live ? `<div class="fixture-row-score"><span class="fixture-live-dot"></span></div>` : '');

    return `
      <div class="fixture-row">
        ${timeCell}
        <div class="fixture-row-teams">
          <div class="fixture-row-team">${logoImg(f.homeLogo)}<span>${f.homeTeam}</span></div>
          <div class="fixture-row-team">${logoImg(f.awayLogo)}<span>${f.awayTeam}</span></div>
        </div>
        ${scoreCell}
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="fixture-block-header">${headerLogo}<span class="fixture-block-league-name">${leagueName}</span></div>
    ${rows}
  `;

  el.addEventListener('click', e => e.stopPropagation());
  return el;
}

async function loadFixtures(targetPage) {
  const page = targetPage || document.getElementById('sports-page');
  try {
    const res = await fetch('/api/sports');
    if (!res.ok) return;
    const data = await res.json();
    const fixtures = data.fixtures || [];
    if (fixtures.length === 0) {
      const msg = data.keyMissing
        ? '⚙️ Add a FOOTBALL_API_KEY to Vercel to see live fixtures.'
        : '⚽ No fixtures scheduled today for your tracked leagues.';
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.style.cssText = 'padding:32px 16px;text-align:center;color:#555;font-size:14px;';
      empty.textContent = msg;
      page.appendChild(empty);
      return;
    }

    // Group by league, preserving sort order
    const leagueMap = new Map();
    for (const f of fixtures) {
      if (!leagueMap.has(f.league)) leagueMap.set(f.league, { logo: f.leagueLogo, fixtures: [] });
      leagueMap.get(f.league).fixtures.push(f);
    }
    const blockEls = [...leagueMap.entries()].map(([name, { logo, fixtures: lf }]) =>
      buildLeagueFixtureBlock(name, logo, lf)
    );

    // In sports page: stack all blocks on top
    blockEls.forEach((el, i) => {
      page.appendChild(el);
      el.style.transitionDelay = `${i * 60}ms`;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    });
  } catch (err) {
    console.warn('Fixtures load failed:', err.message);
  }
}

async function loadFeed() {
  const page = document.getElementById('feed-page');

  const refreshBtn = document.getElementById('refresh-btn');

  errBanner.classList.add('hidden');
  document.getElementById('end-of-feed').classList.add('hidden');
  page.innerHTML = skeletonHTML();
  refreshBtn.classList.add('spinning');

  try {
    // Build personalization params
    const params = new URLSearchParams();
    const pref = computePreferredTopics();
    if (pref.length > 0) params.set('pref', pref.join(','));
    params.set('style', readingStyle);
    if (interestBrief.trim()) params.set('brief', interestBrief.trim().slice(0, 300));
    if (mindsetSummary.trim()) params.set('mindset', mindsetSummary.trim().slice(0, 300));
    // Pass last 10 saved headlines for duplicate detection
    const recentHeadlines = [...savedCardsMap.values()]
      .slice(-10)
      .map(c => c.headline)
      .filter(Boolean);
    if (recentHeadlines.length > 0) params.set('seen', recentHeadlines.join('|'));

    // Custom topics + language
    if (customTopics.length > 0 && customTopics.length < ALL_TOPICS.length)
      params.set('topics', customTopics.join(','));
    if (!showPt) params.set('pt', '0');

    const res = await fetch(`/api/feed?${params}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    // Silently filter duplicate cards
    feedCards = (data.cards || []).filter(c => !c.duplicate);
    renderFeedPage(feedCards, data.daily_brief || '');
  } catch (err) {
    page.innerHTML = '';
    document.getElementById('error-msg').textContent = `Failed to load feed: ${err.message}`;
    errBanner.classList.remove('hidden');
  } finally {
    refreshBtn.classList.remove('spinning');
  }
}

// ─────────────────────────────────────────────
// Topic clustering
// ─────────────────────────────────────────────
function clusterFeedCards(cards) {
  // Simple keyword-overlap clustering
  function keywords(card) {
    const text = ((card.headline || '') + ' ' + (card.summary || '')).toLowerCase();
    const stop = new Set(['the','a','an','and','of','in','to','for','on','is','are','was','were','it','this','that','with','at','by','from','as','be','has','have','had','will','or','but','not','its','their','than','also','been','about']);
    return new Set(text.match(/\b[a-z][a-z'-]{3,}\b/g)?.filter(w => !stop.has(w)) || []);
  }
  function overlap(a, b) {
    let n = 0; a.forEach(w => { if (b.has(w)) n++; });
    return n / Math.max(a.size, b.size, 1);
  }
  const THRESHOLD = 0.28;
  const kws = cards.map(keywords);
  const used = new Array(cards.length).fill(false);
  const result = [];
  for (let i = 0; i < cards.length; i++) {
    if (used[i]) continue;
    const cluster = [cards[i]];
    used[i] = true;
    for (let j = i + 1; j < cards.length && cluster.length < 4; j++) {
      if (!used[j] && overlap(kws[i], kws[j]) >= THRESHOLD) {
        cluster.push(cards[j]);
        used[j] = true;
      }
    }
    if (cluster.length > 1) result.push({ _isCluster: true, cards: cluster });
    else result.push(cards[i]);
  }
  return result;
}
