// Pull to refresh
// ─────────────────────────────────────────────
(function setupPullToRefresh() {
  let startY = 0, pulling = false;
  const indicator = document.getElementById('pull-indicator');
  document.addEventListener('touchstart', e => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 20) indicator.classList.add('visible');
  }, { passive: true });
  document.addEventListener('touchend', async e => {
    if (!pulling) return;
    pulling = false;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 70) {
      if (activeTab === 'feed') await loadFeed();
      else if (activeTab === 'sports') await renderSportsPage();
    }
    indicator.classList.remove('visible');
  }, { passive: true });
})();

// ─────────────────────────────────────────────
// Swipe gestures on cards
// ─────────────────────────────────────────────
(function setupSwipeGestures() {
  let sx = 0, sy = 0, swipingEl = null, swipingCard = null;
  document.addEventListener('touchstart', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    // Don't intercept save-btn taps
    if (e.target.closest('.save-btn, a, button')) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    swipingEl = card;
    swipingCard = feedCards.find(c => c.id === card.dataset.id) ||
                  sportsRssCards.find(c => c.id === card.dataset.id);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!swipingEl) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dy) > Math.abs(dx) + 10) { swipingEl = null; return; }
    if (Math.abs(dx) > 30) {
      swipingEl.classList.toggle('swipe-right', dx > 0);
      swipingEl.classList.toggle('swipe-left', dx < 0);
    }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!swipingEl) return;
    const dx = e.changedTouches[0].clientX - sx;
    const el = swipingEl; const card = swipingCard;
    swipingEl = null; swipingCard = null;
    el.classList.remove('swipe-right', 'swipe-left');
    if (Math.abs(dx) < 60) return;
    if (dx > 0 && card && !savedIds.has(card.id)) {
      // Swipe right → save
      openIntentSheet(card, el);
    } else if (dx < 0) {
      // Swipe left → dismiss
      el.style.transition = 'opacity .25s, transform .25s';
      el.style.opacity = '0'; el.style.transform = 'translateX(-40px)';
      setTimeout(() => el.remove(), 280);
    }
  }, { passive: true });
})();

// ─────────────────────────────────────────────
// Search
// ─────────────────────────────────────────────
function runSearch(q) {
  const resultsEl = document.getElementById('search-results');
  if (!q.trim()) { resultsEl.innerHTML = ''; return; }
  const lower = q.toLowerCase();
  const results = [];

  // Feed cards
  feedCards.forEach(c => {
    const text = ((c.headline || '') + ' ' + (c.summary || '')).toLowerCase();
    if (text.includes(lower))
      results.push({ type: 'Article', title: c.headline, snippet: c.summary, card: c });
  });
  // Saved cards
  [...savedCardsMap.values()].forEach(c => {
    if (results.some(r => r.card?.id === c.id)) return;
    const text = ((c.headline || '') + ' ' + (c.summary || '')).toLowerCase();
    if (text.includes(lower))
      results.push({ type: 'Saved', title: c.headline, snippet: c.summary, card: c });
  });
  // Notes
  notesArr.forEach(n => {
    if (n.text.toLowerCase().includes(lower))
      results.push({ type: 'Note', title: n.text.slice(0, 80), snippet: null, note: n });
  });

  if (results.length === 0) {
    resultsEl.innerHTML = `<div id="search-empty">No results for "${q}"</div>`;
    return;
  }
  resultsEl.innerHTML = '';
  results.slice(0, 30).forEach(r => {
    const el = document.createElement('div');
    el.className = 'search-result';
    el.innerHTML = `<div class="search-result-type">${r.type}</div>
      <div class="search-result-title">${r.title || ''}</div>
      ${r.snippet ? `<div class="search-result-snippet">${r.snippet}</div>` : ''}`;
    el.addEventListener('click', () => {
      document.getElementById('search-overlay').classList.remove('open');
      if (r.card?.url) window.open(r.card.url, '_blank', 'noopener');
      else if (r.note) { /* switch to notes tab */ document.querySelector('[data-tab="notes"]').click(); }
    });
    resultsEl.appendChild(el);
  });
}

document.getElementById('search-btn').addEventListener('click', () => {
  document.getElementById('search-overlay').classList.add('open');
  setTimeout(() => document.getElementById('search-input').focus(), 100);
});
document.getElementById('search-cancel').addEventListener('click', () => {
  document.getElementById('search-overlay').classList.remove('open');
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
});
document.getElementById('search-input').addEventListener('input', e => runSearch(e.target.value));

// ─────────────────────────────────────────────
// Custom topics + language toggle (settings)
// ─────────────────────────────────────────────
function renderTopicChips() {
  const container = document.getElementById('topic-chips');
  if (!container) return;
  container.innerHTML = '';
  ALL_TOPICS.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'topic-chip' + (customTopics.includes(t) ? ' active' : '');
    chip.textContent = t.charAt(0).toUpperCase() + t.slice(1);
    chip.addEventListener('click', async () => {
      if (customTopics.includes(t)) {
        if (customTopics.length <= 1) return; // keep at least 1
        customTopics = customTopics.filter(x => x !== t);
      } else {
        customTopics = [...customTopics, t];
      }
      chip.classList.toggle('active', customTopics.includes(t));
      await dbPutSetting('custom_topics', customTopics.join(','));
    });
    container.appendChild(chip);
  });
}

const langToggleInput = document.getElementById('lang-toggle-input');
if (langToggleInput) {
  langToggleInput.addEventListener('change', async () => {
    showPt = langToggleInput.checked;
    await dbPutSetting('show_pt', showPt ? '1' : '0');
  });
}

// ─────────────────────────────────────────────
// Weekly digest
// ─────────────────────────────────────────────
async function checkWeeklyDigest() {
  const today = new Date();
  if (today.getDay() !== 1) return; // Monday only
  const lastDigest = await dbGetSetting('last_digest_date');
  const todayStr = today.toISOString().split('T')[0];
  if (lastDigest === todayStr) return; // already done today

  const savedArr = [...savedCardsMap.values()];
  if (savedArr.length < 3) return;

  const savedHeadlines = savedArr.map(c => c.headline).filter(Boolean);
  const savedIntents = savedArr.map(c => c.saveTag).filter(Boolean);
  const noteTexts = notesArr.map(n => n.text).filter(Boolean);

  try {
    const res = await fetch('/api/digest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ savedHeadlines, savedIntents, noteTexts }),
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.digest) return;

    // Store as a special digest note
    const note = {
      id: `digest-${todayStr}`,
      text: `📋 Weekly Digest — ${today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}\n\n${data.digest}`,
      ts: Date.now(),
      isDigest: true,
    };
    notesArr = [note, ...notesArr.filter(n => n.id !== note.id)];
    await dbPutNote(note);
    await dbPutSetting('last_digest_date', todayStr);
    document.getElementById('notes-count').textContent = notesArr.length;
  } catch (err) {
    console.warn('Weekly digest failed:', err.message);
  }
}

// ─────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────
(async () => {
  db = await openDB();
  const [savedArr, notesFromDB, signalsFromDB, storedStyle, storedBrief, storedMindset, storedMindsetCount, storedTopics, storedPt] = await Promise.all([
    dbGetAll(),
    dbGetAllNotes(),
    dbGetAllSignals(),
    dbGetSetting('reading_style'),
    dbGetSetting('interest_brief'),
    dbGetSetting('mindset_summary'),
    dbGetSetting('mindset_note_count'),
    dbGetSetting('custom_topics'),
    dbGetSetting('show_pt'),
  ]);
  savedArr.forEach(c => { savedIds.add(c.id); savedCardsMap.set(c.id, c); });
  notesArr = notesFromDB.sort((a, b) => b.ts - a.ts);
  signals = signalsFromDB;
  if (storedStyle) readingStyle = storedStyle;
  if (storedBrief) interestBrief = storedBrief;
  if (storedMindset) mindsetSummary = storedMindset;
  if (storedMindsetCount != null) mindsetNoteCount = storedMindsetCount;
  if (storedTopics) customTopics = storedTopics.split(',').filter(t => ALL_TOPICS.includes(t));
  if (storedPt === '1') { showPt = true; const li = document.getElementById('lang-toggle-input'); if (li) li.checked = true; }
  renderTopicChips();
  updateBadges();
  await loadFeed();
  checkWeeklyDigest().catch(() => {});
})();
